language: "en-US"
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
    # Pinned explicitly rather than relying on default-branch auto-detection.
    # On a freshly created repo that detection lagged and CodeRabbit skipped
    # PR #1 with "auto reviews are disabled on base/target branches other than
    # the default branch", even though the base was main.
    base_branches:
      - "main"
